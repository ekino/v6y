# Local stack: builds every image from source and runs it.
#
#   docker compose up --build
#
# Each service now builds its own target from v6y-config/Dockerfile, so the
# images match exactly what CI publishes. Nothing is bind-mounted: the previous
# version mounted ./:/app over every service, which overwrote the image contents
# and made the published images untestable. For hot-reloading development, run
# the apps outside Docker with `pnpm start:dev:all`.
#
# Healthchecks live in the Dockerfile, so they ship with the images instead of
# only applying when they are started through this file.
#
# To run the published images instead of building, use docker-compose.deploy.yml.

x-backend-env: &backend-env
  PSQL_DB_HOST: ${PSQL_DB_HOST:-v6y-database}
  PSQL_DB_NAME: ${PSQL_DB_NAME}
  PSQL_DB_USER: ${PSQL_DB_USER}
  PSQL_DB_PASSWORD: ${PSQL_DB_PASSWORD}
  PSQL_DB_PORT: ${PSQL_DB_PORT:-5432}
  GITLAB_PRIVATE_TOKEN: ${GITLAB_PRIVATE_TOKEN}
  GITHUB_PRIVATE_TOKEN: ${GITHUB_PRIVATE_TOKEN}
  JWT_SECRET: ${JWT_SECRET}

x-queue-env: &queue-env
  V6Y_QUEUE_HOST: v6y-redis
  V6Y_QUEUE_PORT: ${V6Y_QUEUE_PORT:-6379}
  V6Y_QUEUE_PREFIX: ${V6Y_QUEUE_PREFIX:-v6y}

services:
  v6y-redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Redis holds the recurring audit job schedulers, so it is persisted like the
    # database instead of being treated as a pure cache. The analyzer still
    # reconciles the schedulers against the database on boot, which covers the
    # cases this volume cannot (a flush, a fresh volume, a lost append-only file).
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - v6y-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  v6y-database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PSQL_DB_USER}
      POSTGRES_PASSWORD: ${PSQL_DB_PASSWORD}
      POSTGRES_DB: ${PSQL_DB_NAME}
    # PSQL_DB_HOST_PORT only controls the host mapping. Inside the network
    # PostgreSQL always listens on 5432, so PSQL_DB_PORT (used by the services to
    # connect) must stay 5432 while the bundled database is in use.
    ports:
      - "${PSQL_DB_HOST_PORT:-5432}:5432"
    volumes:
      - v6y-database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_DB_USER} -d ${PSQL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  v6y-migrate:
    image: ${REGISTRY-}v6y-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${PSQL_DB_USER}:${PSQL_DB_PASSWORD}@v6y-database:5432/${PSQL_DB_NAME}
    depends_on:
      v6y-database:
        condition: service_healthy
    restart: "no"

  v6y-bff:
    image: ${REGISTRY-}v6y-bff:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: bff
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      <<: *backend-env
      V6Y_BFF_API_PATH: ${V6Y_BFF_API_PATH}
      V6Y_BFF_API_PORT: ${V6Y_BFF_API_PORT:-4001}
      V6Y_MAIN_API_PATH: ${V6Y_MAIN_API_PATH}
      V6Y_MAIN_ANALYZER_TRIGGER_API_PATH: http://v6y-bfb-main-analyzer:4002/v6y/bfb-main/trigger-application-analysis.json
      V6Y_MAIN_ANALYZER_SCHEDULE_API_PATH: http://v6y-bfb-main-analyzer:4002/v6y/bfb-main/schedule-application-analysis.json
      V6Y_INTERNAL_API_SECRET: ${V6Y_INTERNAL_API_SECRET}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully

  v6y-bfb-main-analyzer:
    image: ${REGISTRY-}v6y-bfb-main-analyzer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: bfb-main-analyzer
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_MAIN_API_PATH: ${V6Y_MAIN_API_PATH}
      V6Y_MAIN_API_PORT: ${V6Y_MAIN_API_PORT:-4002}
      V6Y_STATIC_ANALYZER_API_PATH: ${V6Y_STATIC_ANALYZER_API_PATH}
      V6Y_STATIC_ANALYZER_API_PORT: ${V6Y_STATIC_ANALYZER_API_PORT:-4003}
      V6Y_DYNAMIC_ANALYZER_API_PATH: ${V6Y_DYNAMIC_ANALYZER_API_PATH}
      V6Y_DYNAMIC_ANALYZER_API_PORT: ${V6Y_DYNAMIC_ANALYZER_API_PORT:-4004}
      V6Y_DEVOPS_API_PATH: ${V6Y_DEVOPS_API_PATH}
      V6Y_DEVOPS_API_PORT: ${V6Y_DEVOPS_API_PORT:-4005}
      V6Y_AUDIT_SCHEDULE_TIMEZONE: ${V6Y_AUDIT_SCHEDULE_TIMEZONE:-UTC}
      V6Y_INTERNAL_API_SECRET: ${V6Y_INTERNAL_API_SECRET}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-static-code-auditor:
    image: ${REGISTRY-}v6y-bfb-static-code-auditor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: bfb-static-code-auditor
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_STATIC_ANALYZER_API_PATH: ${V6Y_STATIC_ANALYZER_API_PATH}
      V6Y_STATIC_ANALYZER_API_PORT: ${V6Y_STATIC_ANALYZER_API_PORT:-4003}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-url-dynamic-auditor:
    image: ${REGISTRY-}v6y-bfb-url-dynamic-auditor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: bfb-url-dynamic-auditor
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_DYNAMIC_ANALYZER_API_PATH: ${V6Y_DYNAMIC_ANALYZER_API_PATH}
      V6Y_DYNAMIC_ANALYZER_API_PORT: ${V6Y_DYNAMIC_ANALYZER_API_PORT:-4004}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-devops-auditor:
    image: ${REGISTRY-}v6y-bfb-devops-auditor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: bfb-devops-auditor
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_DEVOPS_API_PATH: ${V6Y_DEVOPS_API_PATH}
      V6Y_DEVOPS_API_PORT: ${V6Y_DEVOPS_API_PORT:-4005}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-frontend:
    image: ${REGISTRY-}v6y-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: frontend
      args:
        # Inlined into the browser bundle here; setting it below under
        # environment would not reach client-side code.
        NEXT_PUBLIC_V6Y_BFF_PATH: ${NEXT_PUBLIC_V6Y_BFF_PATH}
    restart: unless-stopped
    ports:
      - "4006:4006"
    environment:
      # Server-side rewrite target, on the container network. Distinct from the
      # browser-facing NEXT_PUBLIC_V6Y_BFF_PATH build arg above.
      V6Y_BFF_PROXY_TARGET: http://v6y-bff:4001/v6y/graphql/

  v6y-back-office:
    image: ${REGISTRY-}v6y-back-office:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: v6y-config/Dockerfile
      target: back-office
      args:
        NEXT_PUBLIC_V6Y_BFF_PATH: ${NEXT_PUBLIC_V6Y_BFF_PATH}
    restart: unless-stopped
    ports:
      - "4008:4008"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}

volumes:
  v6y-database-data: null
  v6y-redis-data: null
