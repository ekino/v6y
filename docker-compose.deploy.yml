# Deployment stack: pulls the published images, builds nothing.
#
#   REGISTRY=ghcr.io/ekino/ IMAGE_TAG=latest \
#     docker compose -f docker-compose.deploy.yml up -d
#
# Pin IMAGE_TAG to sha-<short> or to a release tag for a reproducible deploy;
# `latest` follows the main branch.
#
# Every value below is read at container runtime. The one exception is
# NEXT_PUBLIC_V6Y_BFF_PATH, which next build inlines into the browser bundle:
# changing it requires rebuilding the two front images, not restarting them.
#
# v6y-database is provided for a self-contained host. When the target platform
# offers a managed PostgreSQL, delete that service and point PSQL_DB_HOST at it.

x-backend-env: &backend-env
  PSQL_DB_HOST: ${PSQL_DB_HOST:-v6y-database}
  PSQL_DB_NAME: ${PSQL_DB_NAME}
  PSQL_DB_USER: ${PSQL_DB_USER}
  PSQL_DB_PASSWORD: ${PSQL_DB_PASSWORD}
  PSQL_DB_PORT: ${PSQL_DB_PORT:-5432}
  GITLAB_PRIVATE_TOKEN: ${GITLAB_PRIVATE_TOKEN}
  GITHUB_PRIVATE_TOKEN: ${GITHUB_PRIVATE_TOKEN}
  JWT_SECRET: ${JWT_SECRET}

x-queue-env: &queue-env
  V6Y_QUEUE_HOST: ${V6Y_QUEUE_HOST:-v6y-redis}
  V6Y_QUEUE_PORT: ${V6Y_QUEUE_PORT:-6379}
  V6Y_QUEUE_PREFIX: ${V6Y_QUEUE_PREFIX:-v6y}

x-service-defaults: &service-defaults
  pull_policy: always
  restart: unless-stopped

services:
  v6y-redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Persisted, not treated as a cache: Redis holds the recurring audit job
    # schedulers. The analyzer reconciles them against the database on boot,
    # which covers what this volume cannot (a flush, a fresh volume, a lost AOF).
    command: ["redis-server", "--appendonly", "yes"]
    # Deliberately not published on the host, like the database.
    volumes:
      - v6y-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  v6y-database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PSQL_DB_USER}
      POSTGRES_PASSWORD: ${PSQL_DB_PASSWORD}
      POSTGRES_DB: ${PSQL_DB_NAME}
    # Deliberately not published on the host: only the services on this network
    # need to reach the database.
    volumes:
      - v6y-database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_DB_USER} -d ${PSQL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  v6y-migrate:
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-migrate:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${PSQL_DB_USER}:${PSQL_DB_PASSWORD}@${PSQL_DB_HOST:-v6y-database}:${PSQL_DB_PORT:-5432}/${PSQL_DB_NAME}
    depends_on:
      v6y-database:
        condition: service_healthy

  v6y-bff:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-bff:${IMAGE_TAG:-latest}
    ports:
      - "4001:4001"
    environment:
      <<: *backend-env
      V6Y_BFF_API_PATH: ${V6Y_BFF_API_PATH}
      V6Y_BFF_API_PORT: ${V6Y_BFF_API_PORT:-4001}
      V6Y_MAIN_API_PATH: ${V6Y_MAIN_API_PATH}
      V6Y_MAIN_ANALYZER_TRIGGER_API_PATH: http://v6y-bfb-main-analyzer:4002/v6y/bfb-main/trigger-application-analysis.json
      V6Y_MAIN_ANALYZER_SCHEDULE_API_PATH: http://v6y-bfb-main-analyzer:4002/v6y/bfb-main/schedule-application-analysis.json
      V6Y_INTERNAL_API_SECRET: ${V6Y_INTERNAL_API_SECRET:-}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully

  v6y-bfb-main-analyzer:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-bfb-main-analyzer:${IMAGE_TAG:-latest}
    ports:
      - "4002:4002"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_MAIN_API_PATH: ${V6Y_MAIN_API_PATH}
      V6Y_MAIN_API_PORT: ${V6Y_MAIN_API_PORT:-4002}
      V6Y_STATIC_ANALYZER_API_PATH: ${V6Y_STATIC_ANALYZER_API_PATH}
      V6Y_STATIC_ANALYZER_API_PORT: ${V6Y_STATIC_ANALYZER_API_PORT:-4003}
      V6Y_DYNAMIC_ANALYZER_API_PATH: ${V6Y_DYNAMIC_ANALYZER_API_PATH}
      V6Y_DYNAMIC_ANALYZER_API_PORT: ${V6Y_DYNAMIC_ANALYZER_API_PORT:-4004}
      V6Y_DEVOPS_API_PATH: ${V6Y_DEVOPS_API_PATH}
      V6Y_DEVOPS_API_PORT: ${V6Y_DEVOPS_API_PORT:-4005}
      V6Y_AUDIT_SCHEDULE_TIMEZONE: ${V6Y_AUDIT_SCHEDULE_TIMEZONE:-UTC}
      V6Y_INTERNAL_API_SECRET: ${V6Y_INTERNAL_API_SECRET:-}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-static-code-auditor:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-bfb-static-code-auditor:${IMAGE_TAG:-latest}
    ports:
      - "4003:4003"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_STATIC_ANALYZER_API_PATH: ${V6Y_STATIC_ANALYZER_API_PATH}
      V6Y_STATIC_ANALYZER_API_PORT: ${V6Y_STATIC_ANALYZER_API_PORT:-4003}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-url-dynamic-auditor:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-bfb-url-dynamic-auditor:${IMAGE_TAG:-latest}
    ports:
      - "4004:4004"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_DYNAMIC_ANALYZER_API_PATH: ${V6Y_DYNAMIC_ANALYZER_API_PATH}
      V6Y_DYNAMIC_ANALYZER_API_PORT: ${V6Y_DYNAMIC_ANALYZER_API_PORT:-4004}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-bfb-devops-auditor:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-bfb-devops-auditor:${IMAGE_TAG:-latest}
    ports:
      - "4005:4005"
    environment:
      <<: [*backend-env, *queue-env]
      V6Y_DEVOPS_API_PATH: ${V6Y_DEVOPS_API_PATH}
      V6Y_DEVOPS_API_PORT: ${V6Y_DEVOPS_API_PORT:-4005}
    depends_on:
      v6y-migrate:
        condition: service_completed_successfully
      v6y-redis:
        condition: service_healthy

  v6y-frontend:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-frontend:${IMAGE_TAG:-latest}
    ports:
      - "4006:4006"
    environment:
      # Server-side rewrite target, on the container network. The browser-facing
      # NEXT_PUBLIC_V6Y_BFF_PATH is baked into the image at build time.
      V6Y_BFF_PROXY_TARGET: http://v6y-bff:4001/v6y/graphql/

  v6y-frontend-bo:
    <<: *service-defaults
    image: ${REGISTRY:-ghcr.io/ekino/}v6y-frontend-bo:${IMAGE_TAG:-latest}
    ports:
      - "4008:4008"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}

volumes:
  v6y-database-data: null
  v6y-redis-data: null
